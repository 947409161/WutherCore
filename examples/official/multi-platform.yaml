      path: data/rulesets/telegram-domain.mrs
      every: 24h
      via: direct

    telegram-ip:
      type: ipcidr
      format: mrs
      url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs"
      path: data/rulesets/telegram-ip.mrs
