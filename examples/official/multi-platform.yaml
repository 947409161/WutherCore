route:
  preset: custom

  # MRS 规则来自 MetaCubeX/meta-rules-dat 的 meta 分支。
  # path 是跨平台相对缓存路径，首次成功后可离线使用上次有效版本。
  sets:
    ads:
      type: domain
      format: mrs
      url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"
      path: data/rulesets/ads.mrs
      every: 24h
      via: direct

    private-domain:
      type: domain
      format: mrs
      url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
      path: data/rulesets/private-domain.mrs
      every: 24h
      via: direct

    geoip-private:
      type: ipcidr
      format: mrs
      url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"
      path: data/rulesets/private-ip.mrs
      every: 24h
      via: direct

    cn-domain:
      type: domain
      format: mrs
      url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
      path: data/rulesets/cn-domain.mrs
      every: 24h
      via: direct

    geoip-cn:
      type: ipcidr
      format: mrs
      url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
      path: data/rulesets/cn-ip.mrs
      every: 24h
      via: direct

    apple-cn:
