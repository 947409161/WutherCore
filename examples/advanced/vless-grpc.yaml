version: 1
profile: desktop
name: advanced-vless-grpc

listen:
  local: 7890
  share: false

nodes:
  - name: vless-grpc
    protocol: vless
    address: edge.example.com:443
    login:
      uuid: 00000000-0000-0000-0000-000000000000
    secure:
      tls: true
      tls-settings:
        serverName: edge.example.com
        alpn: [h2]
        fingerprint: chrome
    transport:
      kind: grpc
      grpcSettings:
        authority: edge.example.com
        serviceName: tunnel
        multiMode: true
        idle_timeout: 45s
        health_check_timeout: 10s
        permit_without_stream: false
        initial_windows_size: 1048576
        max_message_size: 4194304
        queue_capacity: 64
    streamSettings:
      sockopt:
        tcpFastOpen: true
        tcpKeepAliveIdle: 60
        tcpKeepAliveInterval: 15
        domainStrategy: UseIP
        happyEyeballs:
          tryDelayMs: 250
          interleave: 1
          maxConcurrentTry: 4

groups:
  main:
    choose: stable
    use: [nodes]
    check: https://www.gstatic.com/generate_204
    sticky: site

route:
  preset: global
  final: main

resolver:
  mode: smart
  fake: off
  servers:
    bootstrap: https://223.5.5.5/dns-query
  nameserver: [bootstrap]
  proxy-server-nameserver: [bootstrap]

capture:
  on: false

ui:
  on: false
