version: 1
profile: desktop
name: hysteria2-structured

listen:
  local: 7890
  share: false

nodes:
  - name: hy2-advanced
    protocol: hysteria2
    address: edge.example.com:443
    login:
      password: replace-me
    network:
      udp: true
    params:
      bandwidth:
        up: 100 mbps
        down: 500 mbps
        disableLossCompensation: false
      congestion:
        type: bbr
        bbrProfile: standard
      obfs:
        type: gecko
        gecko:
          password: replace-obfs-password
          minPacketSize: 512
          maxPacketSize: 1200
      quic:
        initStreamReceiveWindow: 8388608
        maxStreamReceiveWindow: 16777216
        initConnReceiveWindow: 16777216
        maxConnReceiveWindow: 33554432
        maxIdleTimeout: 30s
        keepAlivePeriod: 10s
        disablePathMTUDiscovery: false
      tls:
        sni: edge.example.com
        insecure: false
      transport:
        type: udp
        udp:
          minHopInterval: 20s
          maxHopInterval: 40s

groups:
  main:
    choose: stable
    use: [nodes]
    check: https://www.gstatic.com/generate_204
    sticky: site

route:
  preset: global
  final: main

resolver:
  mode: smart
  fake: off
  servers:
    bootstrap: https://223.5.5.5/dns-query
  nameserver: [bootstrap]
  proxy-server-nameserver: [bootstrap]

capture:
  on: false

ui:
  on: false
