name: Setup Firefox Neqo build tools
description: Install only the native tools missing from the current runner image.

runs:
  using: composite
  steps:
    - name: Ensure Linux tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        declare -A packages=(
          [clang]=clang
          [gyp]=gyp
          [hg]=mercurial
          [ninja]=ninja-build
          [pkg-config]=pkg-config
        )
        missing=()
        for command in "${!packages[@]}"; do
          command -v "$command" >/dev/null 2>&1 || missing+=("${packages[$command]}")
        done
        if ((${#missing[@]})); then
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "${missing[@]}"
        fi

    - name: Ensure macOS tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v gyp >/dev/null 2>&1; then
          gyp_venv="$RUNNER_TEMP/gyp-next"
          python3 -m venv "$gyp_venv"
          "$gyp_venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input "gyp-next==0.22.2"
          echo "$gyp_venv/bin" >> "$GITHUB_PATH"
        fi
        if ! command -v hg >/dev/null 2>&1; then
          brew install mercurial
        fi
        if ! command -v ninja >/dev/null 2>&1; then
          brew install ninja
        fi

    - name: Ensure Windows tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $missingPythonTools = @()
        if (-not (Get-Command gyp -ErrorAction SilentlyContinue)) {
          $missingPythonTools += 'gyp-next==0.22.2'
        }
        if (-not (Get-Command hg -ErrorAction SilentlyContinue)) {
          $missingPythonTools += 'mercurial==7.2.3'
        }
        if ($missingPythonTools.Count -gt 0) {
          $toolsVenv = Join-Path $env:RUNNER_TEMP 'neqo-python-tools'
          python -m venv $toolsVenv
          & "$toolsVenv\Scripts\python.exe" -m pip install `
            --disable-pip-version-check --no-input @missingPythonTools
          (Join-Path $toolsVenv 'Scripts') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
        if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
          choco install ninja --yes --no-progress
        }
