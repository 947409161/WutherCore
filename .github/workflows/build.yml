name: Build Matrix

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; defaults to the triggering ref.
        required: false
        type: string
        default: ""
      version:
        description: Optional version included in archive filenames.
        required: false
        type: string
        default: ""
      tags:
        description: Exact comma-separated component tags; empty uses the standard build.
        required: false
        type: string
        default: ""
      platforms:
        description: Platform group to build (all, linux, android, windows, or macos).
        required: false
        type: string
        default: all
      retention-days:
        description: Artifact retention period.
        required: false
        type: number
        default: 1
  workflow_dispatch:
    inputs:
      tags:
        description: Exact component tags, for example with_quic,with_vless,with_grpc. Empty uses standard.
        required: false
        type: string
        default: ""
      platforms:
        description: Platform group to compile.
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - android
          - windows
          - macos

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platforms || 'all' }}-${{ inputs.tags || 'standard' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  prepare:
    name: Resolve build matrix
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.inputs.outputs.tags }}
      tag-label: ${{ steps.inputs.outputs.tag-label }}
      tag-key: ${{ steps.inputs.outputs.tag-key }}
      platforms: ${{ steps.inputs.outputs.platforms }}
      retention-days: ${{ steps.inputs.outputs.retention-days }}

    steps:
      - name: Validate build inputs
        id: inputs
        shell: bash
        env:
          REQUESTED_TAGS: ${{ inputs.tags }}
          REQUESTED_PLATFORMS: ${{ inputs.platforms || 'all' }}
          REQUESTED_RETENTION: ${{ inputs.retention-days || 1 }}
        run: |
          set -euo pipefail
          normalized="$(tr ' ;' ',,' <<< "$REQUESTED_TAGS" | sed -E 's/,+/,/g; s/^,//; s/,$//')"
          if [ -n "$normalized" ] && [[ ! "$normalized" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]]; then
            echo "::error::Component tags must be a comma/space-separated list of Cargo feature names."
            exit 1
          fi
          if [[ ! "$REQUESTED_PLATFORMS" =~ ^(all|linux|android|windows|macos)$ ]]; then
            echo "::error::Platforms must be all, linux, android, windows, or macos."
            exit 1
          fi

          tag_label="${normalized:-standard (default)}"
          tag_key="standard"
          if [ -n "$normalized" ]; then
            tag_key="$(printf '%s' "$normalized" | sha256sum | cut -c1-16)"
          fi

          echo "tags=$normalized" >> "$GITHUB_OUTPUT"
          echo "tag-label=$tag_label" >> "$GITHUB_OUTPUT"
          echo "tag-key=$tag_key" >> "$GITHUB_OUTPUT"
          echo "platforms=$REQUESTED_PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "retention-days=$REQUESTED_RETENTION" >> "$GITHUB_OUTPUT"
          {
            echo "## Build matrix"
            echo
            echo "- Platforms: \`$REQUESTED_PLATFORMS\`"
            echo "- Components: \`$tag_label\`"
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux (${{ matrix.platform.name }})
    if: needs.prepare.outputs.platforms == 'all' || needs.prepare.outputs.platforms == 'linux'
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu
            name: linux-amd64
            runner: ubuntu-24.04
            builder: cargo
            packages: ""
            default-tags: standard
          - target: aarch64-unknown-linux-gnu
            name: linux-arm64
            runner: ubuntu-24.04-arm
            builder: cargo
            packages: ""
            default-tags: standard
          - target: x86_64-unknown-linux-musl
            name: linux-amd64-musl
            runner: ubuntu-24.04
            builder: cargo
            packages: musl-tools
            default-tags: portable
          - target: aarch64-unknown-linux-musl
            name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            builder: cargo
            packages: musl-tools
            default-tags: portable
          - target: i686-unknown-linux-gnu
            name: linux-i686
            runner: ubuntu-24.04
            builder: cargo
            packages: gcc-multilib g++-multilib
            default-tags: portable
          - target: s390x-unknown-linux-gnu
            name: linux-s390x
            runner: ubuntu-24.04
            builder: cross
            packages: ""
            default-tags: portable

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve target components
        id: components
        shell: bash
        env:
          DEFAULT_TAGS: ${{ matrix.platform.default-tags }}
          REQUESTED_TAGS: ${{ needs.prepare.outputs.tags }}
          REQUESTED_LABEL: ${{ needs.prepare.outputs.tag-label }}
        run: |
          tags="$REQUESTED_TAGS"
          label="$REQUESTED_LABEL"
          if [ -z "$tags" ] && [ "$DEFAULT_TAGS" = "portable" ]; then
            tags="portable"
            label="portable (platform default)"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Install target system toolchain
        if: matrix.platform.packages != ''
        shell: bash
        env:
          PACKAGES: ${{ matrix.platform.packages }}
        run: |
          sudo apt-get update
          # The package list is controlled by the static matrix above.
          read -r -a packages <<< "$PACKAGES"
          sudo apt-get install --no-install-recommends -y "${packages[@]}"

      - name: Ensure Firefox Neqo build tools
        if: >-
          (needs.prepare.outputs.tags == '' && matrix.platform.default-tags == 'standard') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',with_young,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',standard,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',all_components,')
        uses: ./.github/actions/setup-neqo

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: build-${{ matrix.platform.target }}-${{ needs.prepare.outputs.tag-key }}
          targets: ${{ matrix.platform.target }}
          cache-targets: true
          enable-sccache: ${{ matrix.platform.builder != 'cross' }}

      - name: Install Cross
        if: matrix.platform.builder == 'cross'
        uses: taiki-e/install-action@v2.85.2
        with:
          tool: cross@0.2.5

      - name: Build Linux binary with Cargo
        if: matrix.platform.builder == 'cargo'
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          WUTHER_BUILD_TAGS: ${{ steps.components.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cargo build --release --locked --target "$TARGET" \
              -p wuther-core --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cargo build --release --locked --target "$TARGET" -p wuther-core
          fi

      - name: Build Linux binary with Cross
        if: matrix.platform.builder == 'cross'
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          WUTHER_BUILD_TAGS: ${{ steps.components.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cross build --release --locked --target "$TARGET" \
              -p wuther-core --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cross build --release --locked --target "$TARGET" -p wuther-core
          fi

      - name: Package artifact
        id: package
        env:
          TARGET: ${{ matrix.platform.target }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
          RELEASE_VERSION: ${{ inputs.version }}
          WUTHER_BUILD_TAG_LABEL: ${{ steps.components.outputs.label }}
        run: >-
          python scripts/package-artifact.py
          --target "$TARGET"
          --platform "$PLATFORM_NAME"
          --version "$RELEASE_VERSION"
          --tags "$WUTHER_BUILD_TAG_LABEL"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          archive: false
          overwrite: true
          retention-days: ${{ needs.prepare.outputs.retention-days }}

  android:
    name: Android (${{ matrix.platform.name }})
    if: needs.prepare.outputs.platforms == 'all' || needs.prepare.outputs.platforms == 'android'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: aarch64-linux-android
            ndk-target: arm64-v8a
            name: android-arm64
          - target: armv7-linux-androideabi
            ndk-target: armeabi-v7a
            name: android-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve target components
        id: components
        shell: bash
        env:
          REQUESTED_TAGS: ${{ needs.prepare.outputs.tags }}
          REQUESTED_LABEL: ${{ needs.prepare.outputs.tag-label }}
        run: |
          tags="$REQUESTED_TAGS"
          label="$REQUESTED_LABEL"
          if [ -z "$tags" ]; then
            tags="portable"
            label="portable (platform default)"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: build-${{ matrix.platform.target }}-${{ needs.prepare.outputs.tag-key }}
          targets: ${{ matrix.platform.target }}
          cache-targets: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r29
          add-to-path: true
          local-cache: true

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2.85.2
        with:
          tool: cargo-ndk@4.1.2

      - name: Build Android binary
        shell: bash
        env:
          NDK_TARGET: ${{ matrix.platform.ndk-target }}
          TARGET: ${{ matrix.platform.target }}
          WUTHER_BUILD_TAGS: ${{ steps.components.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cargo ndk --target "$NDK_TARGET" --platform 24 \
              build --release --locked -p wuther-core \
              --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cargo ndk --target "$NDK_TARGET" --platform 24 \
              build --release --locked -p wuther-core
          fi

      - name: Package artifact
        id: package
        env:
          TARGET: ${{ matrix.platform.target }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
          RELEASE_VERSION: ${{ inputs.version }}
          WUTHER_BUILD_TAG_LABEL: ${{ steps.components.outputs.label }}
        run: >-
          python scripts/package-artifact.py
          --target "$TARGET"
          --platform "$PLATFORM_NAME"
          --version "$RELEASE_VERSION"
          --tags "$WUTHER_BUILD_TAG_LABEL"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          archive: false
          overwrite: true
          retention-days: ${{ needs.prepare.outputs.retention-days }}

  windows:
    name: Windows (${{ matrix.platform.name }})
    if: needs.prepare.outputs.platforms == 'all' || needs.prepare.outputs.platforms == 'windows'
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            name: windows-amd64-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            name: windows-arm64-msvc
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: build-${{ matrix.platform.target }}-${{ needs.prepare.outputs.tag-key }}
          targets: ${{ matrix.platform.target }}
          cache-targets: true

      - name: Ensure Firefox Neqo build tools
        if: >-
          needs.prepare.outputs.tags == '' ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',with_young,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',standard,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',all_components,')
        uses: ./.github/actions/setup-neqo

      - name: Build Windows binary
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          WUTHER_BUILD_TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cargo build --release --locked --target "$TARGET" \
              -p wuther-core --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cargo build --release --locked --target "$TARGET" -p wuther-core
          fi

      - name: Smoke-test Windows binary
        shell: pwsh
        env:
          TARGET: ${{ matrix.platform.target }}
        run: '& "target/$env:TARGET/release/wuther-core.exe" --version'

      - name: Package artifact
        id: package
        shell: pwsh
        env:
          TARGET: ${{ matrix.platform.target }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
          RELEASE_VERSION: ${{ inputs.version }}
          WUTHER_BUILD_TAG_LABEL: ${{ needs.prepare.outputs.tag-label }}
        run: |
          python scripts/package-artifact.py `
            --target "$env:TARGET" `
            --platform "$env:PLATFORM_NAME" `
            --version "$env:RELEASE_VERSION" `
            --tags "$env:WUTHER_BUILD_TAG_LABEL"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          archive: false
          overwrite: true
          retention-days: ${{ needs.prepare.outputs.retention-days }}

  macos:
    name: macOS (${{ matrix.platform.name }})
    if: needs.prepare.outputs.platforms == 'all' || needs.prepare.outputs.platforms == 'macos'
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-apple-darwin
            name: macos-amd64
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            name: macos-arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: build-${{ matrix.platform.target }}-${{ needs.prepare.outputs.tag-key }}
          targets: ${{ matrix.platform.target }}
          cache-targets: true

      - name: Ensure Firefox Neqo build tools
        if: >-
          needs.prepare.outputs.tags == '' ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',with_young,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',standard,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',all_components,')
        uses: ./.github/actions/setup-neqo

      - name: Build macOS binary
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          WUTHER_BUILD_TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cargo build --release --locked --target "$TARGET" \
              -p wuther-core --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cargo build --release --locked --target "$TARGET" -p wuther-core
          fi

      - name: Smoke-test macOS binary
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: "./target/$TARGET/release/wuther-core --version"

      - name: Package artifact
        id: package
        env:
          TARGET: ${{ matrix.platform.target }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
          RELEASE_VERSION: ${{ inputs.version }}
          WUTHER_BUILD_TAG_LABEL: ${{ needs.prepare.outputs.tag-label }}
        run: >-
          python3 scripts/package-artifact.py
          --target "$TARGET"
          --platform "$PLATFORM_NAME"
          --version "$RELEASE_VERSION"
          --tags "$WUTHER_BUILD_TAG_LABEL"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          archive: false
          overwrite: true
          retention-days: ${{ needs.prepare.outputs.retention-days }}

  complete:
    name: Build matrix complete
    if: always()
    needs:
      - prepare
      - linux
      - android
      - windows
      - macos
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Verify selected platform jobs
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          {
            echo "## Build matrix result"
            echo
            echo "| Platform | Result |"
            echo "| --- | --- |"
            echo "| Linux | $LINUX_RESULT |"
            echo "| Android | $ANDROID_RESULT |"
            echo "| Windows | $WINDOWS_RESULT |"
            echo "| macOS | $MACOS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "$PREPARE_RESULT" "$LINUX_RESULT" "$ANDROID_RESULT" \
            "$WINDOWS_RESULT" "$MACOS_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A selected build job did not succeed."
              exit 1
            fi
          done
