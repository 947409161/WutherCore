[package]
name = "core-process"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parking_lot   = { workspace = true }
tracing       = { workspace = true }
serde         = { workspace = true }
once_cell     = { workspace = true }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android", target_os = "macos"))'.dependencies]
# Maintained cross-platform wrappers over Windows IP Helper, Linux/Android
# NETLINK_INET_DIAG + procfs, and macOS libproc.
netstat2 = "0.11.2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[target.'cfg(target_os = "android")'.dependencies]
# JNI 桥 —— 调 ConnectivityManager.getConnectionOwnerUid 反查跨 UID 连接。
# 与 core-capture 的 android_jni 同版本，避免 JavaVM 类型不一致。
jni = "0.22"
parking_lot = { workspace = true }
libc = "0.2"
